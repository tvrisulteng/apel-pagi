<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apel TVRI Sulteng</title>
  
  <!-- PWA METADATA MUTLAK -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00458b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apel TVRI">
  <link rel="apple-touch-icon" href="https://drive.google.com/file/d/1f2FOpISGrn0Bj8GSKye2Qlpp1EdCNbKP/view?usp=drive_link">

  <style>
    :root { --primary: #00458b; --bg: #f4f6f9; --text: #2c3e50; --danger: #e74c3c; --success: #27ae60; --info: #0284c7; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; color: var(--text); }
    .app-container { background: #fff; padding: 25px 20px; border-radius: 12px; width: 100%; max-width: 360px; box-sizing: border-box; border: 1px solid #e1e5eb; box-shadow: 0 8px 24px rgba(0,0,0,0.06); position: relative; }
    
    .wa-banner { display: none; background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-align: center; margin-bottom: 15px; border: 1px solid #ffeeba; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .header-info h2 { margin: 0; font-size: 16px; color: var(--primary); font-weight: 800; }
    .header-info p { margin: 2px 0 0; font-size: 11px; color: #7f8c8d; }
    .clock-display { font-size: 20px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    
    .input-group { position: relative; margin-bottom: 15px; }
    label { display: block; font-size: 11px; font-weight: 700; color: #95a5a6; margin-bottom: 6px; text-transform: uppercase; }
    select, input[type="text"] { width: 100%; padding: 14px 40px 14px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #f8fafc; font-weight: 600; color: var(--primary); transition: 0.2s; }
    select:focus, input[type="text"]:focus { outline: none; border-color: var(--primary); background: #fff; }
    
    .input-icon-right { position: absolute; right: 12px; top: 34px; font-size: 16px; display: none; }
    .valid-icon { display: block; color: var(--success); }
    .suggestion-box { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; max-height: 160px; overflow-y: auto; z-index: 10; margin-top: 4px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .suggestion-item { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 13px; cursor: pointer; color: var(--text); font-weight: 500; }
    .suggestion-item:active, .suggestion-item:hover { background: #f1f5f9; color: var(--primary); }
    
    .gps-container { display: flex; gap: 10px; margin-bottom: 20px; }
    .status-bar { flex: 1; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-align: center; background: #e2e8f0; color: #475569; display: flex; flex-direction: column; justify-content: center; gap: 4px; border: 1px solid transparent; }
    .status-ok { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    .status-err { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .status-warn { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .gps-hint { font-size: 10px; font-weight: 500; opacity: 0.8; }
    .btn-retry-gps { display: none; background: var(--bg); border: 1px solid #cbd5e1; color: var(--text); border-radius: 8px; padding: 0 15px; font-size: 18px; cursor: pointer; }
    
    .camera-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #f8fafc; border: 2px dashed #cbd5e1; padding: 18px; border-radius: 10px; color: var(--primary); font-weight: 700; cursor: pointer; position: relative; margin-bottom: 8px; transition: 0.2s; }
    .camera-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
    .hint-text { font-size: 11px; color: #95a5a6; text-align: center; margin-bottom: 20px; display: block; }
    
    .preview-container { display: none; margin-bottom: 20px; text-align: center; }
    #previewImg { width: 100%; border-radius: 10px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 10px; }
    .btn-retake { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 10px 20px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }

    .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 13px; transition: 0.2s; position: relative; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; flex-direction: column; }
    .btn-submit:disabled { background: #94a3b8; color: #f8fafc; cursor: not-allowed; }
    .psy-hint { font-size: 9px; font-weight: 500; opacity: 0.8; display: none; margin-top: -5px; }
    .spinner { display: none; width: 16px; height: 16px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
    .modal-box { background: #fff; border-radius: 16px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    
    .modal-header { padding: 25px 20px 15px; }
    .modal-icon { font-size: 45px; margin-bottom: 10px; }
    .modal-header h3 { margin: 0 0 5px; font-size: 20px; font-weight: 800; }
    .modal-body { padding: 0 20px 20px; font-size: 13px; color: #475569; line-height: 1.6; white-space: pre-wrap; }
    .modal-footer { padding: 15px; background: #f8fafc; border-top: 1px solid #f1f5f9; }
    .modal-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; }
    
    .modal-success .modal-header h3 { color: var(--success); }
    .modal-success .modal-btn { background: var(--success); color: white; }
    .modal-error .modal-header h3 { color: var(--danger); }
    .modal-error .modal-btn { background: var(--danger); color: white; }
    .modal-info .modal-header h3 { color: var(--info); }
    .modal-info .modal-btn { background: var(--info); color: white; }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="waBanner" class="wa-banner">⚠️ Buka link ini di Google Chrome / Safari agar sistem tidak terblokir.</div>

    <div class="header">
      <div class="header-info">
        <h2>PRESENSI APEL PAGI</h2>
        <p>LPP TVRI Sulteng</p>
      </div>
      <div class="clock-display" id="clock">00:00:00</div>
    </div>

    <div class="input-group">
      <label>Status Kehadiran</label>
      <select id="jenisInput" onchange="ubahModeUI()">
        <option value="Hadir Apel">Hadir Apel Pagi (Di Kantor)</option>
        <option value="Dinas Luar (DL)">Dinas Luar (DL)</option>
        <option value="Sakit">Sakit</option>
        <option value="Cuti">Cuti / Izin Lainnya</option>
      </select>
    </div>
    
    <div class="gps-container">
      <div id="statusGPS" class="status-bar"><span>Membaca Sensor GPS...</span></div>
      <button id="btnRetryGPS" class="btn-retry-gps" onclick="tarikGPS()" title="Cari Ulang GPS">🔄</button>
    </div>
    
    <div class="input-group">
      <label>Identitas Pegawai</label>
      <input type="text" id="pegawaiInput" placeholder="Memuat data pegawai..." autocomplete="off" disabled>
      <span class="input-icon-right" id="iconValidasi">✅</span>
      <div id="suggestionBox" class="suggestion-box"></div>
    </div>

    <div class="camera-btn" id="btnUploadArea">
      <span id="teksUpload">📸 Buka Kamera Selfie</span>
      <input type="file" accept="image/*" capture="user" id="fotoInput">
    </div>
    <span class="hint-text" id="teksHint">*Pastikan wajah dan background terlihat jelas</span>
    
    <div class="preview-container" id="previewContainer">
      <img id="previewImg" alt="Preview Foto">
      <button class="btn-retake" onclick="ulangiFoto()">🔄 Ulangi Foto</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>
    
    <button class="btn-submit" id="btnAbsen" disabled onclick="prosesData()">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="spinner" id="spinnerSubmit"></span>
        <span id="teksSubmit">KIRIM DATA ABSENSI</span>
      </div>
      <span class="psy-hint" id="psyHint">Mengamankan waktu klik Anda...</span>
    </button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <div class="modal-header">
        <div class="modal-icon" id="modalIcon">✔️</div>
        <h3 id="modalTitle">Status</h3>
      </div>
      <div class="modal-body" id="modalMsg">Pesan detail di sini...</div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="tutupModal()" id="btnTutupModal">TUTUP</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // KUNCI API RAHASIA (GANTI DENGAN WEB APP URL ANDA)
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyIL1BepXKQC8JjG0utMNQ3CmMAEhjZdFVG8jdqvB8XYCWVsF4TLnheVCM0jLDyxDl4/exec';

    // REGISTRASI SERVICE WORKER UNTUK PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW PWA Aktif!', reg.scope))
          .catch(err => console.log('SW Gagal:', err));
      });
    }

    if (/WhatsApp/i.test(navigator.userAgent)) document.getElementById('waBanner').style.display = 'block';

    const KANTOR_LAT = -0.886911, KANTOR_LNG = 119.863481, RADIUS_MAX = 1000; 
    let lat = null, lng = null, dataPegawaiServer = [], fotoBase64Akhir = null;
    let waktuClient = "", jarakPegawai = 9999;
    
    const inp = document.getElementById('pegawaiInput'), iconValidasi = document.getElementById('iconValidasi');
    const box = document.getElementById('suggestionBox'), stGPS = document.getElementById('statusGPS');
    const btnRetryGPS = document.getElementById('btnRetryGPS'), btn = document.getElementById('btnAbsen');
    const jenisInput = document.getElementById('jenisInput'), fotoInput = document.getElementById('fotoInput');
    const teksUpload = document.getElementById('teksUpload'), teksHint = document.getElementById('teksHint');
    const btnUploadArea = document.getElementById('btnUploadArea'), previewContainer = document.getElementById('previewContainer');
    const spinner = document.getElementById('spinnerSubmit'), tSubmit = document.getElementById('teksSubmit'), psyHint = document.getElementById('psyHint');

    setInterval(() => {
      waktuClient = new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Makassar', hour12: false });
      document.getElementById('clock').innerText = waktuClient.replace(/\./g, ':');
    }, 1000);

    // FETCH DATA PEGAWAI DARI API GOOGLE
    fetch(API_URL + "?action=getPegawai")
      .then(res => res.json())
      .then(d => { 
        dataPegawaiServer = d; 
        inp.disabled = false;
        inp.placeholder = "Ketik Nama atau NIP...";
      })
      .catch(err => {
        inp.placeholder = "⚠️ Gagal memuat data dari server.";
      });

    function cekValidasiNama() {
      const val = inp.value.trim();
      if(dataPegawaiServer.find(p => (p.nama + ' (' + p.nip + ')') === val)) {
        iconValidasi.classList.add('valid-icon'); inp.style.borderColor = "var(--success)";
      } else {
        iconValidasi.classList.remove('valid-icon'); inp.style.borderColor = "#cbd5e1";
      }
    }

    function renderSuggestion() {
      const val = inp.value.toLowerCase();
      box.innerHTML = ''; cekValidasiNama();
      if(!val) { box.style.display = 'none'; return; }
      
      const match = dataPegawaiServer.filter(p => p.nama.toLowerCase().includes(val) || p.nip.toString().includes(val));
      if(match.length) {
        match.forEach(m => {
          const div = document.createElement('div');
          div.className = 'suggestion-item'; div.innerText = `${m.nama} (${m.nip})`;
          div.onclick = () => { inp.value = div.innerText; box.style.display = 'none'; cekValidasiNama(); };
          box.appendChild(div);
        });
        box.style.display = 'block';
      } else box.style.display = 'none';
    }

    inp.addEventListener('input', renderSuggestion);
    inp.addEventListener('focus', renderSuggestion); 
    document.addEventListener('click', e => { if(e.target !== inp && e.target.className !== 'suggestion-item') box.style.display = 'none'; });

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const p = Math.PI/180;
      const a = Math.sin((lat2-lat1)*p/2)**2 + Math.cos(lat1*p) * Math.cos(lat2*p) * Math.sin((lon2-lon1)*p/2)**2;
      return Math.round(6371e3 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function updateLogikaGPS() {
      if(lat && lng) {
        jarakPegawai = hitungJarak(KANTOR_LAT, KANTOR_LNG, lat, lng);
        btnRetryGPS.style.display = "none";
        if (jenisInput.value === 'Hadir Apel') {
          if (jarakPegawai <= RADIUS_MAX) {
            stGPS.className = 'status-bar status-ok'; stGPS.innerHTML = `<span>📍 Posisi Valid (${jarakPegawai}m)</span><span class="gps-hint">Anda berada di area TVRI</span>`; btn.disabled = false;
          } else {
            stGPS.className = 'status-bar status-err'; stGPS.innerHTML = `<span>⛔ Luar Radius (${jarakPegawai}m)</span><span class="gps-hint">Maks 50m dari titik kantor TVRI</span>`; btn.disabled = true; btnRetryGPS.style.display = "block";
          }
        } else {
          stGPS.className = 'status-bar status-warn'; stGPS.innerHTML = `<span>📎 Mode Izin / DL Aktif</span><span class="gps-hint">Titik GPS direkam untuk audit metadata</span>`; btn.disabled = false;
        }
      }
    }

    function tarikGPS() {
      stGPS.className = 'status-bar'; stGPS.innerHTML = `<span>Mencari Satelit...</span>`; btnRetryGPS.style.display = "none"; btn.disabled = true;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          lat = pos.coords.latitude; lng = pos.coords.longitude; updateLogikaGPS();
        }, err => { 
          stGPS.className = 'status-bar status-err'; stGPS.innerHTML = `<span>❌ GPS Ditolak/Lemah</span><span class="gps-hint">Cek gembok 🔒 di bar atas & izinkan Lokasi</span>`; btnRetryGPS.style.display = "block";
        }, { enableHighAccuracy: true, timeout: 10000 });
      }
    }
    tarikGPS(); 

    function ubahModeUI() {
      ulangiFoto(); 
      if (jenisInput.value === 'Hadir Apel') {
        teksUpload.innerText = "📸 Buka Kamera Selfie"; teksHint.innerText = "*Pastikan wajah dan background terlihat jelas"; fotoInput.setAttribute("capture", "user");
      } else {
        teksUpload.innerText = "📄 Upload Bukti Surat"; teksHint.innerText = "*Wajib format GAMBAR (Foto Kertas/Screenshot PDF)"; fotoInput.removeAttribute("capture"); 
      }
      updateLogikaGPS();
    }

    function ulangiFoto() {
      fotoBase64Akhir = null; fotoInput.value = ""; document.getElementById('previewImg').src = ""; 
      previewContainer.style.display = "none"; btnUploadArea.style.display = "flex"; teksHint.style.display = "block";
    }

    fotoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          try {
            const cvs = document.getElementById('canvas');
            const ctx = cvs.getContext('2d');
            const MAX_W = 700; const scale = MAX_W / img.width;
            cvs.width = MAX_W; cvs.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
            let warnaWatermark = (jenisInput.value === 'Hadir Apel') ? "rgba(220, 38, 38, 0.8)" : "rgba(0, 69, 139, 0.8)";
            ctx.fillStyle = warnaWatermark; ctx.fillRect(0, cvs.height - 70, cvs.width, 70);
            ctx.font = "bold 15px Arial"; ctx.fillStyle = "#ffffff";
            
            let labelTeks = (jenisInput.value === 'Hadir Apel') ? `WAKTU: ${waktuClient.replace(/\./g, ':')} WITA` : `DOKUMEN: ${jenisInput.value.toUpperCase()}`;
            ctx.fillText(labelTeks, 15, cvs.height - 45);
            ctx.fillText(`GPS: ${lat || '0'}, ${lng || '0'}`, 15, cvs.height - 20);
            
            fotoBase64Akhir = cvs.toDataURL('image/jpeg', 0.8); 
          } catch(err) {
            fotoBase64Akhir = event.target.result;
          }
          btnUploadArea.style.display = "none"; teksHint.style.display = "none";
          document.getElementById('previewImg').src = fotoBase64Akhir; previewContainer.style.display = "block";
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    const modalOverlay = document.getElementById('modalOverlay'), modalBox = document.getElementById('modalBox');
    let reloadTutup = false, autoCloseTimer = null;

    function tutupModal() { 
      modalOverlay.style.display = 'none'; 
      if(autoCloseTimer) clearTimeout(autoCloseTimer);
      if(reloadTutup) location.reload(); 
    }

    function tampilkanModal(tipe, ikon, judul, pesan, isReload) {
      modalBox.className = `modal-box modal-${tipe}`;
      document.getElementById('modalIcon').innerText = ikon;
      document.getElementById('modalTitle').innerText = judul;
      document.getElementById('modalMsg').innerText = pesan;
      document.getElementById('btnTutupModal').innerText = isReload ? "MEMUAT ULANG..." : "SAYA MENGERTI";
      reloadTutup = isReload;
      modalOverlay.style.display = 'flex';
      if(isReload) autoCloseTimer = setTimeout(() => { location.reload(); }, 3500);
    }

    // MENGIRIM DATA KE API GOOGLE VIA FETCH
    function prosesData() {
      const val = inp.value.trim();
      const valid = dataPegawaiServer.find(p => (p.nama + ' (' + p.nip + ')') === val);
      
      if (!valid) return tampilkanModal('error', '⚠️', 'Identitas Bodong', 'Ketik dan pilih nama Anda dari daftar sugesti.', false);
      if (!fotoBase64Akhir) return tampilkanModal('error', '⚠️', 'Data Kurang', 'Anda belum melampirkan foto / selfie.', false);
      if (!lat || !lng) return tampilkanModal('error', '⚠️', 'GPS Menunggu', 'Titik GPS belum terkunci. Klik tombol Coba Lagi (🔄).', false);

      const jamKlik = waktuClient.replace(/\./g, ':');
      tSubmit.innerText = "SINKRONISASI DATA...";
      psyHint.innerText = `Waktu klik (${jamKlik}) diamankan server.`;
      psyHint.style.display = "block"; spinner.style.display = "block"; btn.disabled = true;

      const payload = { nip: valid.nip, nama: valid.nama, lat: lat, lng: lng, jarak: jarakPegawai, fotoBase64: fotoBase64Akhir, clientTime: jamKlik, jenis: jenisInput.value };
      
      // Kirim Data JSON menggunakan fetch API ke backend Anda
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain untuk bypass CORS Options Error di Apps Script
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        spinner.style.display = "none"; psyHint.style.display = "none";
        if (res.status === 'success') {
          tampilkanModal('success', '✅', 'Berhasil', res.pesan, true);
        } else if (res.status === 'info') {
          tampilkanModal('info', '🛡️', 'Data Aman', res.pesan, true);
        } else {
          tampilkanModal('error', '⛔', 'Ditolak Sistem', res.pesan, false);
          tSubmit.innerText = "KIRIM DATA ABSENSI"; btn.disabled = false; 
        }
      })
      .catch(err => {
        spinner.style.display = "none"; psyHint.style.display = "none";
        tampilkanModal('error', '⚠️', 'Koneksi Terputus', 'Gagal menghubungi server. Pastikan internet Anda aktif lalu coba lagi.', false);
        tSubmit.innerText = "KIRIM DATA ABSENSI"; btn.disabled = false; 
      });
    }
  </script>
</body>
</html>
